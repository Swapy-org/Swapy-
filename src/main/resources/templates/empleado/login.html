<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swapy | Ingreso Empleado</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body{margin:0;background:#141110;color:#f3ece4;font-family:'DM Sans',sans-serif;
             display:flex;align-items:center;justify-content:center;min-height:100vh;}
        .box{background:#1e1a17;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:36px;width:360px;max-width:92vw;}
        .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:4px;}
        .logo span{color:#e2793a;}
        .sub{color:#a99c8f;font-size:13px;margin-bottom:24px;}
        label{font-size:12.5px;color:#a99c8f;display:block;margin-bottom:6px;}
        input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
              color:#f3ece4;border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:16px;font-family:inherit;box-sizing:border-box;}
        input:focus{outline:none;border-color:#e2793a;}
        button{width:100%;background:#e2793a;color:#1a1512;border:none;border-radius:12px;
               padding:12px;font-weight:700;font-family:'Syne',sans-serif;font-size:14px;cursor:pointer;}
        .error{background:rgba(239,68,68,0.14);color:#fca5a5;border:1px solid rgba(239,68,68,0.25);
               padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:16px;}
    </style>
</head>
<body>
<form class="box" method="post" th:action="@{/spempleados}">
    <div class="logo">Swapy<span>.</span></div>
    <div class="sub">Panel Empleado</div>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <label for="correo">Correo</label>
    <input type="email" id="correo" name="correo" required autofocus placeholder="empleado@swapy.com">

    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena" required placeholder="••••••••">

    <button type="submit">Ingresar</button>
</form>
</body>
</html>
